<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asset visualization · IRA Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="is-loading">
  <nav class="nav" id="nav"></nav>

  <main>
    <header class="holder">
      <span class="eyebrow">Asset visualization</span>
      <h1 class="holder-name">The Vault</h1>
      <p class="page-sub" id="page-sub"></p>
    </header>

    <section class="class-strip" id="class-strip" aria-label="Asset classes"></section>

    <section class="card" aria-labelledby="vault-title">
      <div class="card-head">
        <div>
          <h2 id="vault-title">Every dollar, in physical form</h2>
          <p class="muted small" id="vault-scale"></p>
        </div>
      </div>
      <div class="vault" id="vault"></div>
    </section>

    <div id="gallery"></div>
  </main>

  <div class="tooltip" id="tooltip" role="status" hidden></div>

  <footer>Not financial advice. Definitely not seafood advice.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="assets.js"></script>
</body>
</html>
