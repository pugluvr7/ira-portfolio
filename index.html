<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IRA Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-name" id="account-name">IRA Portfolio</div>
          <div class="brand-meta" id="account-meta"></div>
        </div>
      </div>
      <div class="tabs" role="navigation" aria-label="Pages">
        <a href="index.html">Dashboard</a>
        <a href="assets.html">Asset visualization</a>
      </div>
      <button id="theme-toggle" class="pill-btn" type="button" aria-label="Toggle dark mode"></button>
    </div>
  </nav>

  <main>
    <header class="holder">
      <span class="eyebrow">Account holder</span>
      <h1 class="holder-name">Wendy</h1>
    </header>

    <section class="top">
      <div class="hero">
        <span class="eyebrow">Total balance</span>
        <div class="hero-value" id="total-value"></div>
        <div class="hero-row">
          <span class="chip" id="day-change"></span>
          <span class="hero-stat"><span class="hero-stat-label">Total gain</span><span id="total-gain"></span></span>
          <span class="hero-stat"><span class="hero-stat-label">Cost basis</span><span id="cost-basis"></span></span>
        </div>
      </div>

      <div class="card contrib">
        <div class="card-head">
          <h2 id="contrib-label">Contributions</h2>
          <span class="badge" id="contrib-pct"></span>
        </div>
        <div class="contrib-value" id="contrib-value"></div>
        <div class="progress" role="progressbar" id="contrib-bar" aria-valuemin="0">
          <div class="progress-fill" id="contrib-fill"></div>
        </div>
        <span class="muted small" id="contrib-remaining"></span>
      </div>
    </section>

    <section class="card" aria-labelledby="perf-title">
      <div class="card-head">
        <div>
          <h2 id="perf-title">Account value</h2>
          <div class="legend" id="perf-legend"></div>
        </div>
        <div class="segmented" role="group" aria-label="Time range" id="range-buttons">
          <button type="button" data-range="12">1Y</button>
          <button type="button" data-range="36">3Y</button>
          <button type="button" data-range="0" class="active">All</button>
        </div>
      </div>
      <div class="chart-wrap" id="perf-chart"></div>
    </section>

    <div class="grid-2">
      <section class="card" aria-labelledby="alloc-title">
        <div class="card-head"><h2 id="alloc-title">Allocation</h2></div>
        <div class="alloc">
          <div id="alloc-chart"></div>
          <table class="alloc-table" id="alloc-table">
            <thead><tr><th>Asset class</th><th class="num">Actual</th><th class="num">Target</th><th class="num">Drift</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="card" aria-labelledby="holdings-title">
        <div class="card-head"><h2 id="holdings-title">Holdings</h2></div>
        <div class="table-scroll">
          <table class="holdings" id="holdings-table">
            <thead>
              <tr>
                <th data-sort="symbol">Symbol</th>
                <th data-sort="value" class="num">Value</th>
                <th data-sort="weight" class="num">Weight</th>
                <th data-sort="gain" class="num">Gain</th>
                <th data-sort="dayChangePct" class="num">Day</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div class="tooltip" id="tooltip" role="status" hidden></div>

  <footer>Sample data — edit <code>data.js</code> to use your own. Not financial advice.</footer>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
